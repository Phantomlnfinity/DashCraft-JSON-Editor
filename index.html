<!doctype html>
<html>
    <head>
        <link rel="stylesheet" href="style.css">
        <script src="script.js" defer></script>
    </head>
    <body>
        <h1>Dashcraft JSON editor</h1>
        <input type="text" placeholder="Link or JSON" id="dataInput">

        <input type="number" placeholder="x" id="x">
        <input type="number" placeholder="y" id="y">
        <input type="number" placeholder="z" id="z">

        <hr>
        <h3>When the track link is pasted, the track JSON will appear in the box below. You can change the coordinates with the boxes above.</h3>
        <hr>

        <div id="output"></div>

        <button id="copyButton">Copy JSON</button>
    </body>
</html>
